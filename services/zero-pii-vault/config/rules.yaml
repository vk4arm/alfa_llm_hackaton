# ==============================================================================
# ZERO-PII VAULT: ПРАВИЛА ОБНАРУЖЕНИЯ И МАСКИРОВАНИЯ ДАННЫХ
# ==============================================================================
# Данный файл содержит конфигурацию регулярных выражений, синтаксических правил,
# стоп-слов командных глаголов и контекстных маркеров банковских намерений.
# Все регулярные выражения компилируются на этапе инициализации микросервиса.
# ==============================================================================

# Общие настройки модуля маскирования
settings:
  # Детализация адресов: false — маскировать адрес единой строкой [ADDRESS],
  # true — дробить на составляющие [CITY], [STREET], [HOUSE], [FLAT], [POSTCODE]
  granular_address: false
  
  # Размер контекстного окна (в символах) до и после имени для анализа интентов
  context_window_chars: 80

# ------------------------------------------------------------------------------
# 1. Регулярные выражения для распознавания категорий ПДн
# ------------------------------------------------------------------------------
patterns:
  # Банковские карты (номера от 13 до 19 цифр с любыми разделителями)
  # Подлежит обязательной валидации контрольной суммы по алгоритму Луна
  card: '(?<!\d)(?:\d[- \t._/~–—]*){12,18}\d(?!\d)'

  # ИНН физических (12 цифр) и юридических лиц (10 цифр) с пробелами/дефисами
  # Подлежит обязательной валидации контрольных коэффициентов ФНС РФ
  inn: '(?i)(?:\bИНН(?:/[А-ЯЁA-Z0-9]+)?\b\s*[:\-–—]?\s*)?((?<!\d)\d{1,6}(?:[- \t._/~–—]+\d{1,6}){1,6}(?!\d)|\b\d{10}\b|\b\d{12}\b)'

  # CVV/CVC/CID коды безопасности (включая разговорные формулировки)
  cvv: '(?i)(?:\b(?:cvv2?|cvc2?|cid|код\s+безопасности|код\s+на\s+обороте|свв|цвв|(?:последние\s+)?три\s+цифр[ыок]+(?:\s+сзади|\s+на\s+обороте)?|(?:последние\s+)?(?:три\s+)?циферк[иек]+(?:\s+сзади|\s+на\s+обороте)?|код\s+сзади)\b[^\d\n]{0,25}?(?:были?|равен|указан)?[:\-–—\s]*?)(\d{3,4})\b'

  # ПИН-код банковской карты
  pin: '(?i)(?:\b(?:пин(?:-?код)?|pin(?:-?code)?|пароль(?:\s+от\s+карты)?)\b[^\d\n]{0,20}?(?:был|стоял|установлен|равен)?[:\-–—\s]*?)(\d{4})(?=[)\]\s,.;\n]|$)'

  # Имя держателя карты (эмбоссированное на лицевой стороне латиницей или кириллицей)
  cardholder: '(?i)(?:\b(?:держатель(?:\s+карты)?|cardholder(?:\s+name)?|card\s*holder|(?:имя\s+)?(?:на\s+карте|на\s+пластике)(?:\s+(?:указано|написано|выбито|стоит))?|карто?ч?ка\s+на\s+имя|на\s+имя\s+держателя)\b\s*[:\-–—]?\s*)([A-Z\s]{3,35}|[А-ЯЁ\s]{3,35})(?=[,\n\.;\)]|$)'

  # Водительское удостоверение (серия и номер РФ)
  driver_license: '(?i)(?:\b(?:водительск[а-я\s]*(?:удостоверени[а-я]*|прав[а-я]*)|прав[а-я]*|в/?у)\b[^\d\n]{0,35}?(?:сери[яи]\s*)?)([0-9]{2}\s?[0-9А-ЯA-Z]{2}\s*(?:№|номер\s*)?[0-9]{6})\b'

  # Код подразделения паспортного органа (включая к/п, штампы и разговорные варианты)
  passport_code: '(?i)\b(?:код(?:\s+на\s+штампе|\s+подразделени[яе]|\s+выдачи|\s+отделения|\s+органа)?|подразделени[ея]|отделени[а-я]*|к/?п)\b[^\d\n]{0,15}?(\b\d{3}[-\s]\d{3}\b)'

  # Серия и номер паспорта гражданина РФ
  passport: '(?i)(?:\b(?:паспорт(?:[а-я\s]*РФ|[а-я]*ные\s+данные|[а-я]*)?|по\s+паспорту|в\s+паспорте|сери[яи]\s+и\s+номер|данные\s+документа|реквизиты\s+паспорта|мой\s+паспорт)\b[^\d\n]{0,35}?(?:сери[яи]\s*)?(\b\d{2}\s?\d{2}\b)\s*(?:№|номер|n\.)?\s*(\b\d{6}\b)|\bсери[яи]\s*(\b\d{2}\s?\d{2}\b)\s*(?:№|номер|n\.)?\s*(\b\d{6}\b))'

  # Орган, выдавший паспорт (УФМС, МВД, ОВД, РОДВ, ТП)
  passport_issuer: '(?i)(?:\b(?:кем\s+выдан|орган[,\s]+выдавший[^\n,;]*|орган\s+выдачи|выдан[а-я]*|получал[а-я]*|оформлял[а-я]*|выдали)\b[^\n,;:]{0,25}?(?:его\s+|в\s+|через\s+)?[:\-–—]?\s*)([^\n,;\(\)]+?(?:отдел[а-я]*|уфмс|мвд|овд|ровд|гу\s+мвд|умвд|тп\s+№|отделени[а-я]*|паспортн[а-я]*)[^\n,;\(\)]*?)(?=\s+\d{2}[./]\d{2}[./]\d{4}|\s*\(|\s*,|\s*;|\s*\n|$)'

  # Дата выдачи паспорта
  passport_date: '(?i)(?:(?:\b(?:дата\s+выдачи(?:\s+паспорта)?|выдан[а-я]*(?:\s+паспорт)?(?:\s+от)?|получен[а-я]*|оформлен[а-я]*|получал[а-я]*|оформлял[а-я]*)\b[^\d\n]{0,120}?)(\d{2}[./]\d{2}[./]\d{4})|(\d{2}[./]\d{2}[./]\d{4})\s*(?:года\s+)?(?:\b(?:выдачи|получения|оформления)\b))'

  # Гражданство
  citizenship: '(?i)(?:\b(?:гражданств[оа-я]*|гражданин[а-я]*|гражданк[а-я]*|подданств[оа-я]*)\b[^\n,;:]{0,15}?(?:я\s+)?[:\-–—]?\s*)(РФ|Российская Федерация|Росси[яие]|Республика\s+[А-Яа-яЁё]+|[А-Яа-яЁё\-]{3,20})\b'

  # Дата рождения (с префиксными маркерами или постфиксным г.р.)
  birth_date: '(?i)(?:(?:\b(?:дата(?:\s+и\s+место)?\s+рождения|д\.?р\.?|родил(?:ся|ась)|г\.?р\.?|рождени[яе]|появил(?:ся|ась)\s+на\s+свет|моего\s+рождения)\b[^\d\n]{0,25}?)(\d{2}[./]\d{2}[./]\d{4})|(\d{2}[./]\d{2}[./]\d{4})\s*(?:г\.?\s*р\.?|год[а-я]*\s+рождени[яе]))'

  # Место рождения (город / субъект РФ)
  birth_place: '(?i)(?:\b(?:родил(?:ся|ась)|появил(?:ся|ась)\s+на\s+свет|урожен(?:ец|ка)|родом)\b[^\n,;]{0,45}?\b(?:в|из)\s+(?:городе\s+|гор\.\s*|г\.\s*)?([А-ЯЁ][а-яё\-]+)|\b(?:место\s+рождени[яе]|урожен(?:ец|ка))\s*[:\-–—]?\s*(?:городе\s+|гор\.\s*|г\.\s*)?([А-ЯЁ][а-яё\-]+))'

  # Адрес электронной почты (RFC 5322 совместимый)
  email: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'

  # Номер мобильного/городского телефона во всех мыслимых форматах
  phone: '(?:(?i:\b(?:тел(?:\.|ефон)?|моб(?:\.|ильный)?|т\.|номер(?:\s+для\s+связи)?|сотовом[уе]?|сотовый)\s*[:\-–—]?\s*))?(?P<num>(?<!\d)(?:(?:\+?7|8|007)[\s\.\-_/–—~]*)?(?:[\(\[]\s*\d{3,4}\s*[\)\]]|(?<!\d)\d{3,4})[\s\.\-_/–—~]*\d{2,3}[\s\.\-_/–—~]*\d{2}[\s\.\-_/–—~]*\d{2}(?!\d)|(?<!\d)(?:(?:\+?7|8|007)[\s\.\-_/–—~]*)?(?:[\(\[]\s*\d{3,4}\s*[\)\]]|(?<!\d)\d{3,4})[\s\.\-_/–—~]*\d{7}(?!\d)|(?<!\d)(?:\+?7|8)\d{10}(?!\d)|(?<!\d)(?:[\(\[]\s*\d{3,4}\s*[\)\]]|(?<!\d)9\d{2})[\s\.\-_/–—~]*\d{2,3}[\s\.\-_/–—~]*\d{2}[\s\.\-_/–—~]*\d{2}(?!\d))'

  # Адрес регистрации / фактического проживания (разговорный и официальный)
  address: '(?i)(?:\b(?:адрес(?:[а-я\s]*регистрации|[а-я\s]*проживания)?|зарегистрирован[а-я\s]*|прожива[а-я]*|прописан[а-я]*|жив[а-я]*|доставк[а-я]*)\b[^\n]{0,35}?(?:по\s+адресу\s+|в\s+|на\s+адрес\s+|на\s+)?[:\-–—]?\s*)((?:г\.|гор\.|город\s+|Россия|[0-9]{6},|[А-ЯЁ][а-яё\-]+|[A-ZА-ЯЁ]{2,5})[^\n;]+?(?:ул\.|улиц[а-я]*|наб\.|пр-?к?т|просп[а-я]*|пер\.|переулок|шоссе|ш\.|бул\.|бульвар|д\.|дом|Арбат)[^\n]+?[0-9]+(?:[,\s]+(?:кв\.|квартир[а-я]*|корп\.|к\.|оф\.|строени[ея]|стр\.)\s*[0-9]+)*)(?=[,\.;\n\)]|\s+хотя|\s+но|\s+паспорт|$)'

  # Явное указание ФИО клиента в анкетах, договорах и обращениях
  identity_person: '(?:(?i:\b(?:клиент[а-я]*|заявител[а-я]*|заемщик[а-я]*|плательщик[а-я]*|получател[а-я]*|бенефициар[а-я]*|фио|я|меня\s+зовут|зовут|ее\s+зовут|его\s+зовут|гражданин[а-я]*|гражданк[а-я]*|обратил(?:ся|ась)|пользовател[а-я]*|владелец|от|с\s+уважением,?)\b)\s*[:\-–—]?\s*)([A-ZА-ЯЁ][a-zа-яё]+(?:\s+[A-ZА-ЯЁ][a-zа-яё]+){1,2})'

# ------------------------------------------------------------------------------
# 2. Контекстные маркеры: метафоры/ролевые промпты vs банковские интенты
# ------------------------------------------------------------------------------

# Метафорические, сравнительные и ролевые триггеры ("Ты, как Пушкин", "в стиле Есенина")
# Личность, сопровождаемая данными маркерами в текущей клаузе, НЕ подлежит маскированию.
metaphor: '(?i)\b(?:ты,?\s+как|как|как\s+если\s+бы|будто|словно|представь,?\s+что\s+ты|в\s+стиле|в\s+манере|в\s+духе|словами|стихи|поэзи[яие]|стихотворени[яе]|произведени[яе]|творчеств[ое]|биографи[яи]|автор[а-я]*|писател[а-я]*|поэт[а-я]*|кто\s+такой|книг[а-я]*|роман[а-я]*|повест[а-я]*|цитат[а-я]*|философи[яие]|теори[яие]|симфони[яие]|картин[а-я]*|по\s+заветам|по\s+рецепту|рассуждай|ответь|напиши)\b'

# Маркеры финансовых операций, платежей, договоров и персональной идентификации
# Если известная личность сопровождается данными маркерами, она ОБЯЗАТЕЛЬНО маскируется.
banking_intent: '(?i)\b(?:перевести|переведи|переведите|перевод[а-я]*|перекинь[а-я]*|перебрось[а-я]*|скинь[а-я]*|закинь[а-я]*|отправить|отправь|отправьте|отправление|перечислить|перечисли|перечислите|перечисление|пополнить|пополни|пополните|пополнение|списать|спиши|списание|оплатить|оплати|оплата|выплатить|выплати|выплата|выдать|выдай|счет[а-я]*|карточк[а-я]*|карт[а-я]*|пластик[а-я]*|телефон[а-я]*|сотов[а-я]*|номер[а-я]*|рубл[а-я]*|руб|деньг[а-я]*|средств[а-я]*|сумм[а-я]*|платеж[а-я]*|депозит[а-я]*|вклад[а-я]*|кредит[а-я]*|ипотек[а-я]*|заем[а-я]*|займ[а-я]*|клиент[а-я]*|заявител[а-я]*|заемщик[а-я]*|плательщик[а-я]*|получател[а-я]*|бенефициар[а-я]*|владелец[а-я]*|от\s+клиента|от\s+кого|фио|на\s+имя|в\s+пользу|от\s+имени|заблокировать|заблокируй|разблокировать|разблокируй|выписк[а-я]*|анкет[а-я]*|договор[а-я]*|я,|зовут|ее\s+зовут|его\s+зовут|гражданин[а-я]*|гражданк[а-я]*|обратил[а-я]*|паспорт[а-я]*|инн|свв|cvv|пин|pin|брат[а-я]*|сестр[а-я]*|друг[а-я]*|коллег[а-я]*)\b'

# ------------------------------------------------------------------------------
# 3. Стоп-слова: командные глаголы и служебные лексемы диалогов
# ------------------------------------------------------------------------------
# Слова, которые ни при каких обстоятельствах не могут быть фамилией или именем клиента,
# даже если NER-модель ошибочно помечает их как PER в начале фразы.
verb_stopwords:
  - "отправь"
  - "отправить"
  - "отправьте"
  - "переведи"
  - "перевести"
  - "переведите"
  - "перекинь"
  - "перекинуть"
  - "перекиньте"
  - "скинь"
  - "скинуть"
  - "скиньте"
  - "закинь"
  - "закинуть"
  - "закиньте"
  - "перебрось"
  - "перебросить"
  - "пополни"
  - "пополнить"
  - "пополните"
  - "заблокируй"
  - "заблокировать"
  - "заблокируйте"
  - "разблокируй"
  - "разблокировать"
  - "разблокируйте"
  - "позвони"
  - "позвонить"
  - "позвоните"
  - "напиши"
  - "написать"
  - "напишите"
  - "ответь"
  - "ответить"
  - "ответьте"
  - "рассуждай"
  - "рассуждать"
  - "рассуждайте"
  - "слушай"
  - "слушайте"
  - "проанализируй"
  - "подскажи"
  - "найди"
  - "сделай"
  - "помоги"
  - "оформи"
  - "здравствуйте"
  - "привет"
  - "добрый"
  - "внимание"
  - "сообщение"
  - "запрос"
  - "клиент"
  - "заемщик"
  - "заявитель"
  - "плательщик"
  - "получатель"
  - "бенефициар"
