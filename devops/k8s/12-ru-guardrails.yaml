apiVersion: apps/v1
kind: Deployment
metadata:
  name: ru-guardrails
  namespace: alfa-ai-gateway
  labels:
    app: ru-guardrails
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ru-guardrails
  template:
    metadata:
      labels:
        app: ru-guardrails
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: ru-guardrails
        image: registry.bank.alfa/ai/ru-guardrails:v2.4.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
          name: http
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "3Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: ru-guardrails
  namespace: alfa-ai-gateway
  labels:
    app: ru-guardrails
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    name: http
  selector:
    app: ru-guardrails
