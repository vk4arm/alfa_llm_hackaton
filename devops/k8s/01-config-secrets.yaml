apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: alfa-ai-gateway
  labels:
    app.kubernetes.io/part-of: alfa-ai-gateway
data:
  # General Settings
  LOG_LEVEL: "INFO"
  GATEWAY_PORT: "8000"
  
  # Endpoints & Mesh Discovery
  ZERO_PII_VAULT_URL: "http://zero-pii-vault:8001"
  RU_GUARDRAILS_URL: "http://ru-guardrails:8002"
  RESILIENCE_ROUTER_URL: "http://resilience-router:8003"
  SEMANTIC_CACHE_URL: "http://semantic-cache:8004"
  NLI_FACT_GUARD_URL: "http://nli-fact-guard:8005"
  AUDIT_LOGGER_URL: "http://audit-worm-logger:8006"

  # Databases
  REDIS_HOST: "redis-cluster.alfa-ai-gateway.svc.cluster.local"
  REDIS_PORT: "6379"
  SESSION_TTL_SEC: "300"
  QDRANT_HOST: "qdrant.alfa-ai-gateway.svc.cluster.local"
  QDRANT_PORT: "6333"
  QDRANT_SIMILARITY_THRESHOLD: "0.95"

  # On-Premises Isolated vLLM Cluster Endpoints (Air-Gap)
  VLLM_TIER1_URL: "http://10.120.45.10:8000/v1" # Qwen-2.5-72B-Instruct (4x A100)
  VLLM_TIER2_URL: "http://10.120.45.20:8000/v1" # Qwen-2.5-32B-Instruct (2x A100)
  VLLM_TIER3_URL: "http://10.120.45.30:8000/v1" # Qwen-2.5-14B/7B-AWQ

  # Resilience & Circuit Breaker Thresholds
  CB_FAILURE_THRESHOLD_PCT: "5.0"
  CB_LATENCY_P99_THRESHOLD_MS: "2500.0"
  CB_KV_CACHE_THRESHOLD_PCT: "95.0"
  CB_COOLDOWN_SEC: "30.0"

  # Kaspersky KUMA SIEM & Kafka Integration
  KAFKA_BOOTSTRAP_SERVERS: "kafka-internal.bank.alfa:9092"
  KAFKA_AUDIT_TOPIC: "alfa.ai.gateway.audit.worm"
  KUMA_KAFKA_TOPIC: "alfa.kuma.ai-gateway.events"
  KUMA_CEF_SYSLOG_HOST: "kuma-collector.bank.alfa"
  KUMA_CEF_SYSLOG_PORT: "6514"
  KUMA_CEF_ENABLED: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: alfa-ai-gateway
  labels:
    app.kubernetes.io/part-of: alfa-ai-gateway
type: Opaque
stringData:
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION_VAULT"
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME_KEYCLOAK_OIDC"
  KAFKA_TLS_KEY: "CHANGE_ME_KAFKA_MTLS_CERT"
